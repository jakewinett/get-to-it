name: iOS build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    name: Generate project and build for simulator
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Same script Xcode Cloud runs, so every PR also tests the Xcode Cloud setup:
      # writes the config, installs XcodeGen, generates the project, resolves packages.
      - name: Run Xcode Cloud post-clone script
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: ./ci_scripts/ci_post_clone.sh

      # The project is committed (Xcode Cloud needs the shared scheme in the repo). The script above
      # regenerated it from project.yml, so any difference means someone forgot to run xcodegen.
      - name: Check committed project matches project.yml
        run: |
          if [ -n "$(git status --porcelain -- GetToIt.xcodeproj GetToIt/Info.plist GetToIt/GetToIt.entitlements)" ]; then
            echo "::error::The committed Xcode project is out of date. Run 'xcodegen' in ios/ and commit the result."
            git status --porcelain -- GetToIt.xcodeproj GetToIt/Info.plist GetToIt/GetToIt.entitlements
            # The full diff, so a session without XcodeGen (a Linux cloud container) can apply it.
            git diff -- GetToIt.xcodeproj GetToIt/Info.plist GetToIt/GetToIt.entitlements
            exit 1
          fi

      # Builds the regenerated project even when the check above failed, so compile errors still show.
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project GetToIt.xcodeproj \
            -scheme GetToIt \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | head -50 || true
